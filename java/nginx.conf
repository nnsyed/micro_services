events { worker_connections 1024; }

http {
    server {
        listen 80;

        # 1. Employee Backend Routing
        location /employees {
            proxy_pass http://employee-service:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 2. Cache Backend Routing
        location /cache {
            proxy_pass http://cache-service:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Frontend UI Routing (Passes traffic to the frontend container)
        location / {
            proxy_pass http://frontend-ui:80; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
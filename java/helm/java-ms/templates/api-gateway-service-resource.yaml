apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: {{ .Values.apiGateway.service.type }}
  selector:
    app: api-gateway
  ports:
  - port: {{ .Values.apiGateway.service.port }}
    targetPort: {{ .Values.apiGateway.containerPort }}
    nodePort: {{ .Values.apiGateway.service.nodePort }}

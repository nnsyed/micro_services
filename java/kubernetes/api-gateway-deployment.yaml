apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-config
  namespace: default
data:
  nginx.conf: |
    events { worker_connections 1024; }
    http {
      server {
        listen 80;
        
        # ---------------------- employee service ------------------------
        # Handle request without trailing slash
        location /api/employees {
          proxy_pass http://employee-service:8001/employees;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Handle request with trailing slash - explicitly target /employees
        location /api/employees/ {
          proxy_pass http://employee-service:8001/employees;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ---------------------- cache service ------------------------
        # Handle request without trailing slash
        location /api/cache {
          proxy_pass http://cache-service:8002/cache;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Handle request with trailing slash - explicitly target /caches
        location /api/cache/ {
          proxy_pass http://cache-service:8002/cache;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Root fallback for health checks
        location / {
          return 200 "API Gateway is running!";
          add_header Content-Type text/plain;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: nginx:alpine
        imagePullPolicy: IfNotPresent # Tells Kubernetes to use the local image cache
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
      volumes:
      - name: config-volume
        configMap:
          name: nginx-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

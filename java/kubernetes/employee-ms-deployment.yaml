apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-service-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: employee-service
  template:
    metadata:
      labels:
        app: employee-service
    spec:
      containers:
      - name: employee-service
        image: employee-service:latest
        imagePullPolicy: Never
        env:
        - name: SERVER_PORT
          value: "8001"
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://java-sql-db-1:5432/employeedb
        - name: SPRING_DATASOURCE_USERNAME
          value: postgres
        - name: SPRING_DATASOURCE_PASSWORD
          value: mysecretpassword
        ports:
        - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: employee-service
spec:
  type: NodePort
  selector:
    app: employee-service
  ports:
  - port: 8001
    targetPort: 8001
    nodePort: 30001

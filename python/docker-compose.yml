version: '3.8'

services:
  # Front-Ending Public Entry Point (Bridges Browser Traffic to Internal Apps)
  api-gateway:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend-ui

  # Container 3: UI Static Web App Server
  frontend-ui:
    build: ./frontend

  # Container 1: Employee Business Logic Layer
  employee-service:
    build: ./employee-service
    ports:
      - "8001:8001"  # Exposed directly to your Windows host for step-by-step debugging
    environment:
      - DB_HOST=sql-db
    depends_on:
      - sql-db

  # Container 2: Cache Service Layer
  cache-service:
    build: ./cache-service
    ports:
      - "8002:8002"  # Exposed directly to your Windows host for step-by-step debugging
    environment:
      - REDIS_HOST=redis-db
    depends_on:
      - redis-db

  # Target Relational Database Infrastructure
  sql-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=company
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_password
    ports:
      - "5432:5432"  # Exposed so you can check schema structures using local tools
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d

  # Target Key-Value Cache Infrastructure
  redis-db:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"  # Exposed so you can verify cache writes natively
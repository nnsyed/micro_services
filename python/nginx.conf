server {
    listen 80;

    location / {
        proxy_pass http://frontend-ui:80;
    }

    location /api/employees {
        proxy_pass http://employee-service:8001/employees;
        proxy_method $request_method;  # Explicitly forwards POST, PUT, DELETE styles
    }

    location /api/cache {
        proxy_pass http://cache-service:8002/cache;
        proxy_method $request_method;
    }
}